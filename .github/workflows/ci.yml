name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowsight/web lint
      - run: pnpm --filter @flowsight/web test
      - run: pnpm --filter @flowsight/web build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r apps/api/requirements.txt
      - run: pytest apps/api/tests --cov=apps/api/app
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: sqlite:///./test_flowsight.db
          JWT_SECRET: test-secret-that-is-longer-than-32-characters
