name: Bootstrap FlowSight demo source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack FlowSight source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f flowsight-demo-bootstrap-source.zip ]; then
            echo "No bootstrap ZIP present; nothing to unpack."
            exit 0
          fi
          cp flowsight-demo-bootstrap-source.zip /tmp/flowsight-demo-bootstrap-source.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q -o /tmp/flowsight-demo-bootstrap-source.zip -d . -x ".github/*"
          rm -f flowsight-demo-bootstrap-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Deploy FlowSight AI demo source"
          git push
