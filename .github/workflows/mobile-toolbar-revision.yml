name: Apply mobile toolbar revision

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-toolbar-revision.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile toolbar files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, content) {
            fs.writeFileSync(file, content, 'utf8');
          }

          function replaceOnce(file, before, after) {
            const content = read(file);
            if (!content.includes(before)) {
              throw new Error(`Expected text not found in ${file}`);
            }
            write(file, content.replace(before, after));
          }

          function replaceIfMissing(file, missingNeedle, before, after) {
            const content = read(file);
            if (content.includes(missingNeedle)) return;
            if (!content.includes(before)) {
              throw new Error(`Expected text not found in ${file}`);
            }
            write(file, content.replace(before, after));
          }

          const control = 'apps/web/components/control-tower.tsx';
          replaceIfMissing(control, 'useEffect, useMemo, useState', 'import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";');
          replaceIfMissing(control, 'PackageSearch, Plus, Search', '  Handshake, Mail, MessageSquareMore, PackageSearch, PanelLeftClose, Plus, Search, Send, Settings, ShieldCheck,', '  Handshake, Mail, MessageSquareMore, PackageSearch, Plus, Search, Send, Settings, ShieldCheck,');

          const shortLabels = [
            '};',
            '',
            'const navShortLabels: Record<string, string> = {',
            '  overview: "Home",',
            '  exceptions: "Risks",',
            '  inventory: "Stock",',
            '  "purchase-orders": "POs",',
            '  forecasting: "Forecast",',
            '  scorecards: "Scores",',
            '  tasks: "Tasks",',
            '  imports: "Import",',
            '  quality: "Quality",',
            '  ai: "AI Brief",',
            '  reports: "Reports",',
            '  feedback: "Feedback",',
            '  admin: "Admin",',
            '  "release-notes": "Notes",',
            '  freight: "Command",',
            '  "freight-opportunities": "Loads",',
            '  "freight-carriers": "Carriers",',
            '  "freight-rfqs": "RFQs",',
            '  "freight-awards": "Awards",',
            '  "freight-operations": "Ops",',
            '  "freight-tenders": "Tenders",',
            '  "freight-quotes": "Quotes",',
            '  "freight-invoices": "Invoices",',
            '  "freight-client": "Client",',
            '  "freight-admin": "Admin",',
            '  "freight-tour": "Tour"',
            '};',
            '',
            'export function ControlTower'
          ].join('\n');
          replaceIfMissing(control, 'const navShortLabels', '};\n\nexport function ControlTower', shortLabels);
          replaceIfMissing(control, 'const [tenant, setTenant]', '  const [collapsed, setCollapsed] = useState(false);\n', '');

          const activeScroll = [
            '  useEffect(() => {',
            '    document.querySelector<HTMLElement>(`.sidebar nav a[data-nav-key="${section}"]`)?.scrollIntoView?.({ block: "center", inline: "nearest" });',
            '  }, [section]);',
            ''
          ].join('\n');
          replaceIfMissing(control, 'scrollIntoView?.', '  };\n\n  return (\n', '  };\n\n' + activeScroll + '  return (\n');

          const oldSidebar = [
            '      <aside className={collapsed ? "sidebar collapsed" : "sidebar"}>',
            '        <div className="side-logo"><Logo compact={collapsed} /><button onClick={() => setCollapsed(!collapsed)}><PanelLeftClose /></button></div>',
            '        <nav>{navSections.map(([key, label]) => <Link key={key} className={section === key ? "active" : ""} href={`/app/${key}`}>{icons[key]}<span>{label}</span>{key === "exceptions" && <em>18</em>}</Link>)}<div className="nav-group-label"><span>FREIGHT PROCUREMENT</span></div>{procurementNavSections.map(([key,label]) => <Link key={key} className={section === key ? "active" : ""} href={`/app/${key}`}>{icons[key]}<span>{label}</span>{key === "freight-opportunities" && <em>4</em>}</Link>)}<div className="nav-group-label"><span>FREIGHT OPERATIONS</span></div>{freightOperationsNavSections.map(([key,label]) => <Link key={key} className={section === key ? "active" : ""} href={`/app/${key}`}>{icons[key]}<span>{label}</span>{key === "freight-tenders" && <em>18</em>}</Link>)}</nav>'
          ].join('\n');
          const newSidebar = [
            '      <aside className="sidebar" aria-label="FlowSight app navigation">',
            '        <div className="side-logo"><Logo compact /></div>',
            '        <nav>{navSections.map(([key, label]) => <Link key={key} data-nav-key={key} className={section === key ? "active" : ""} href={`/app/${key}`} title={label} aria-label={label}>{icons[key]}<span>{navShortLabels[key] ?? label}</span>{key === "exceptions" && <em>18</em>}</Link>)}<div className="nav-group-label"><span>PROCURE</span></div>{procurementNavSections.map(([key,label]) => <Link key={key} data-nav-key={key} className={section === key ? "active" : ""} href={`/app/${key}`} title={label} aria-label={label}>{icons[key]}<span>{navShortLabels[key] ?? label}</span>{key === "freight-opportunities" && <em>4</em>}</Link>)}<div className="nav-group-label"><span>OPS</span></div>{freightOperationsNavSections.map(([key,label]) => <Link key={key} data-nav-key={key} className={section === key ? "active" : ""} href={`/app/${key}`} title={label} aria-label={label}>{icons[key]}<span>{navShortLabels[key] ?? label}</span>{key === "freight-tenders" && <em>18</em>}</Link>)}</nav>'
          ].join('\n');
          replaceIfMissing(control, 'aria-label="FlowSight app navigation"', oldSidebar, newSidebar);

          const globals = 'apps/web/app/globals.css';
          replaceIfMissing(globals, '--toolbar-width: 102px', '  --shadow: 0 12px 36px rgba(25, 57, 53, .08);\n}', '  --shadow: 0 12px 36px rgba(25, 57, 53, .08);\n  --toolbar-width: 102px;\n}');

          const oldShell = [
            '.app-shell { min-height:100vh; display:flex; background:#f5f8f7; }',
            '.sidebar { position:fixed; z-index:20; width:238px; height:100vh; background:var(--navy); color:#a9bfbb; padding:20px 13px 14px; display:flex; flex-direction:column; transition:.2s; }',
            '.sidebar.collapsed { width:72px; }',
            '.side-logo { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 8px 14px; border-bottom:1px solid #213d3a; }',
            '.side-logo button { color:#73908b; background:none; border:0; cursor:pointer; }',
            '.side-logo button svg { width:18px; }',
            '.collapsed .side-logo button, .collapsed nav span, .collapsed nav em, .collapsed .side-bottom span, .collapsed .profile div, .collapsed .profile svg { display:none; }',
            '.sidebar nav { display:flex; flex-direction:column; gap:3px; margin-top:16px; overflow:auto; scrollbar-width:none; }',
            '.sidebar nav a { min-height:39px; padding:0 11px; border-radius:7px; display:flex; align-items:center; gap:12px; font-size:12px; font-weight:600; white-space:nowrap; }',
            '.sidebar nav a:hover { color:#fff; background:#173432; }',
            '.sidebar nav a.active { color:#fff; background:#1b4944; }',
            '.sidebar nav svg, .side-bottom svg { width:17px; flex:0 0 auto; }',
            '.sidebar nav em { margin-left:auto; font-style:normal; font-size:10px; min-width:20px; height:20px; display:grid; place-items:center; border-radius:20px; background:#d85d53; color:#fff; }',
            '.side-bottom { margin-top:auto; }',
            '.side-bottom > button { width:100%; color:#91aaa6; border:0; background:none; display:flex; align-items:center; gap:11px; padding:11px; font-size:12px; }',
            '.profile { margin-top:7px; border-top:1px solid #213d3a; padding:15px 8px 0; display:flex; align-items:center; gap:9px; }',
            '.profile > span, .avatar { width:31px; height:31px; display:grid; place-items:center; border:0; border-radius:50%; background:#3fa99b; color:#fff; font-size:10px; font-weight:800; flex:0 0 auto; }',
            '.profile div { display:flex; flex-direction:column; min-width:0; }',
            '.profile b { color:#fff; font-size:11px; }',
            '.profile small { font-size:9px; color:#738e89; }',
            '.profile svg { width:13px; margin-left:auto; }',
            '.collapsed + .app-main { margin-left:72px; }',
            '.app-main { width:calc(100% - 238px); margin-left:238px; transition:.2s; }'
          ].join('\n');
          const newShell = [
            '.app-shell { min-height:100vh; display:flex; background:#f5f8f7; min-width:0; }',
            '.sidebar { position:fixed; inset:0 auto 0 0; z-index:20; width:var(--toolbar-width); height:100vh; height:100dvh; background:var(--navy); color:#a9bfbb; padding:13px 8px 12px; display:flex; flex-direction:column; transition:.2s; overflow:hidden; }',
            '.side-logo { min-height:46px; display:flex; align-items:center; justify-content:center; padding:0 0 12px; border-bottom:1px solid #213d3a; }',
            '.sidebar nav { display:flex; flex-direction:column; gap:5px; margin-top:12px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:8px; }',
            '.sidebar nav::-webkit-scrollbar { display:none; }',
            '.sidebar nav a { position:relative; min-height:62px; padding:8px 4px; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:9px; line-height:1.05; font-weight:700; text-align:center; white-space:normal; }',
            '.sidebar nav a:hover { color:#fff; background:#173432; }',
            '.sidebar nav a.active { color:#fff; background:#1b4944; box-shadow:inset 3px 0 0 var(--teal-2); }',
            '.sidebar nav a span { display:block; max-width:76px; overflow:hidden; text-overflow:ellipsis; }',
            '.sidebar nav svg, .side-bottom svg { width:19px; height:19px; flex:0 0 auto; }',
            '.sidebar nav em { position:absolute; top:6px; right:6px; font-style:normal; font-size:9px; min-width:18px; height:18px; display:grid; place-items:center; border-radius:20px; background:#d85d53; color:#fff; padding:0 4px; }',
            '.nav-group-label { padding:12px 2px 5px!important; text-align:center; }',
            '.nav-group-label span { font-size:7px!important; letter-spacing:.14em; color:#64817c; font-weight:800; }',
            '.side-bottom { margin-top:auto; border-top:1px solid #213d3a; padding-top:8px; }',
            '.side-bottom > button { width:100%; color:#91aaa6; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:8px 3px; font-size:8px; line-height:1.1; font-weight:700; text-align:center; cursor:pointer; }',
            '.profile { margin-top:5px; padding:8px 0 0; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }',
            '.profile > span, .avatar { width:31px; height:31px; display:grid; place-items:center; border:0; border-radius:50%; background:#3fa99b; color:#fff; font-size:10px; font-weight:800; flex:0 0 auto; }',
            '.profile div { display:flex; flex-direction:column; min-width:0; }',
            '.profile b { color:#fff; font-size:8px; line-height:1.1; }',
            '.profile small { font-size:7px; color:#738e89; }',
            '.profile svg { display:none; }',
            '.app-main { width:calc(100% - var(--toolbar-width)); margin-left:var(--toolbar-width); transition:.2s; min-width:0; }'
          ].join('\n');
          replaceIfMissing(globals, '.sidebar nav a span { display:block; max-width:76px;', oldShell, newShell);

          const oldMedia = [
            '@media (max-width: 1100px) {',
            '  .sidebar { width:72px; }.sidebar nav span,.sidebar nav em,.side-bottom span,.profile div,.profile svg,.side-logo button{display:none}.app-main{margin-left:72px;width:calc(100% - 72px)}',
            '  .lower-grid{grid-template-columns:1fr 1fr}.quick-actions{grid-column:1/3}.report-grid{grid-template-columns:1fr 1fr}.admin-grid{grid-template-columns:1fr 1fr}.flag-card{grid-column:1/3}',
            '}',
            '@media (max-width: 760px) {',
            '  .landing-nav .nav-links{display:none}.hero{padding-top:55px}.hero-actions,.trust-row{flex-direction:column;align-items:center}.product-preview{margin:0 15px 70px;height:430px}.mini-sidebar{display:none}.preview-main{padding:22px}.preview-grid{grid-template-columns:1fr}.preview-card.chart{display:none}.value-strip{grid-template-columns:1fr 1fr}.pricing-section{margin:0 15px 60px;padding:32px;grid-template-columns:1fr}.landing footer{flex-direction:column;gap:20px}',
            '  .auth-page{grid-template-columns:1fr}.auth-art{display:none}.auth-form-wrap{padding:30px}.onboard-card{margin:15px;padding:28px 20px}.stepper{padding:0 15px}.stepper span{display:none}.choice-grid,.two-fields{grid-template-columns:1fr}',
            '  .sidebar{display:none}.app-main{margin:0;width:100%}.topbar{padding:0 15px}.mobile-menu{display:block;border:0;background:none}.mobile-menu svg{width:20px}.tenant-switcher .tenant-icon,.tenant-switcher small{display:none}.top-actions .search{display:none}.page{padding:24px 15px}.page-head{align-items:flex-start;gap:15px}.fresh{display:none}.ai-brief{grid-template-columns:auto 1fr}.brief-meta{display:none}.kpi-grid{grid-template-columns:1fr 1fr}.dashboard-grid,.lower-grid,.forecast-grid,.feedback-layout,.admin-grid{grid-template-columns:1fr}.dashboard-grid>*{min-width:0}.quick-actions,.flag-card{grid-column:auto}.chart-panel{display:none}.exception-list>button{grid-template-columns:52px 1fr}.exception-list>button>div:nth-child(2){min-width:0}.impact{display:none}.filterbar{overflow:auto}.table-card{overflow:auto}.table-card table{min-width:750px}.forecast-side{display:grid;grid-template-columns:1fr 1fr}.score-hero,.risk-summary{grid-template-columns:1fr 1fr}.score-hero>div:nth-child(2),.risk-summary>div:nth-child(2){border-right:0}.kanban{grid-template-columns:1fr;overflow:auto}.kanban-col{min-height:auto}.import-summary{grid-template-columns:1fr}.mapping-grid{grid-template-columns:1fr}.mapping-arrows{display:none}.ai-layout{grid-template-columns:1fr}.brief-list{display:none}.ai-document{padding:28px 20px}.report-grid{grid-template-columns:1fr}.quality-score{grid-template-columns:1fr 1fr}.quality-score>div:first-child{grid-column:1/3}.release-list article{grid-template-columns:1fr}.release-list article:before,.release-list article:after{display:none}',
            '}'
          ].join('\n');
          const newMedia = [
            '@media (max-width: 1100px) {',
            '  :root{--toolbar-width:92px}',
            '  .sidebar{width:var(--toolbar-width);padding:12px 7px}',
            '  .sidebar nav a{min-height:60px;font-size:8.5px}',
            '  .sidebar nav a span{max-width:70px}',
            '  .app-main{margin-left:var(--toolbar-width);width:calc(100% - var(--toolbar-width))}',
            '  .lower-grid{grid-template-columns:1fr 1fr}.quick-actions{grid-column:1/3}.report-grid{grid-template-columns:1fr 1fr}.admin-grid{grid-template-columns:1fr 1fr}.flag-card{grid-column:1/3}',
            '}',
            '@media (max-width: 760px) {',
            '  .landing-nav .nav-links{display:none}.hero{padding-top:55px}.hero-actions,.trust-row{flex-direction:column;align-items:center}.product-preview{margin:0 15px 70px;height:430px}.mini-sidebar{display:none}.preview-main{padding:22px}.preview-grid{grid-template-columns:1fr}.preview-card.chart{display:none}.value-strip{grid-template-columns:1fr 1fr}.pricing-section{margin:0 15px 60px;padding:32px;grid-template-columns:1fr}.landing footer{flex-direction:column;gap:20px}',
            '  .auth-page{grid-template-columns:1fr}.auth-art{display:none}.auth-form-wrap{padding:30px}.onboard-card{margin:15px;padding:28px 20px}.stepper{padding:0 15px}.stepper span{display:none}.choice-grid,.two-fields{grid-template-columns:1fr}',
            '  :root{--toolbar-width:82px}',
            '  .sidebar{display:flex;width:var(--toolbar-width);padding:10px 6px}',
            '  .side-logo{min-height:42px;padding-bottom:10px}',
            '  .sidebar nav{gap:4px;margin-top:10px}',
            '  .sidebar nav a{min-height:57px;padding:7px 3px;font-size:8px;border-radius:8px}',
            '  .sidebar nav a span{max-width:64px}',
            '  .sidebar nav svg,.side-bottom svg{width:18px;height:18px}',
            '  .sidebar nav em{top:5px;right:5px;min-width:16px;height:16px;font-size:8px}',
            '  .nav-group-label{padding:10px 0 4px!important}',
            '  .nav-group-label span{font-size:6.5px!important}',
            '  .side-bottom>button{font-size:7.5px;padding:7px 2px}',
            '  .profile div{display:none}',
            '  .app-main{margin-left:var(--toolbar-width);width:calc(100% - var(--toolbar-width))}',
            '  .topbar{padding:0 10px;gap:8px}.mobile-menu{display:none}.tenant-switcher{min-width:0}.tenant-switcher .tenant-icon,.tenant-switcher small,.tenant-switcher>svg{display:none}.tenant-switcher b{display:block;max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-actions{gap:6px}.top-actions .search{display:none}.icon-btn{width:33px;height:33px}.avatar{width:31px;height:31px}.page{padding:22px 10px 46px}.page-head{align-items:flex-start;gap:15px;flex-direction:column}.page-head h1{font-size:23px}.fresh{display:none}.ai-brief{grid-template-columns:1fr;padding:18px}.ai-symbol{display:none}.brief-meta{display:none}.kpi-grid{grid-template-columns:1fr 1fr}.dashboard-grid,.lower-grid,.forecast-grid,.feedback-layout,.admin-grid{grid-template-columns:1fr}.dashboard-grid>*{min-width:0}.quick-actions,.flag-card{grid-column:auto}.chart-panel{display:none}.exception-list>button{grid-template-columns:46px 1fr;padding:12px}.exception-list>button>div:nth-child(2){min-width:0}.impact{display:none}.filterbar{overflow:auto}.filterbar>*{flex:none}.table-card{overflow:auto}.table-card table{min-width:750px}.forecast-toolbar{grid-template-columns:1fr}.forecast-side{display:grid;grid-template-columns:1fr}.score-hero,.risk-summary{grid-template-columns:1fr 1fr}.score-hero>div:nth-child(2),.risk-summary>div:nth-child(2){border-right:0}.kanban{grid-template-columns:1fr;overflow:auto}.kanban-col{min-height:auto}.import-summary{grid-template-columns:1fr}.mapping-grid{grid-template-columns:1fr}.mapping-arrows{display:none}.ai-layout{grid-template-columns:1fr}.brief-list{display:none}.ai-document{padding:28px 20px}.report-grid{grid-template-columns:1fr}.quality-score{grid-template-columns:1fr 1fr}.quality-score>div:first-child{grid-column:1/3}.release-list article{grid-template-columns:1fr}.release-list article:before,.release-list article:after{display:none}',
            '  .freight-head{flex-direction:column;align-items:flex-start}.freight-actions{width:100%;flex-wrap:wrap}.freight-actions .button{flex:1;min-width:130px}.freight-brief{grid-template-columns:1fr;padding:18px}.freight-brief-icon{display:none}.freight-brief>button{grid-column:auto;justify-self:start}.freight-kpis,.client-kpis,.invoice-kpis,.mode-performance,.tender-summary,.invoice-analytics,.dispute-layout,.client-grid,.admin-rate-layout,.comparison-grid,.workflow-cards{grid-template-columns:1fr}.freight-kpis>div,.client-kpis>div,.invoice-kpis>div{border-right:0;border-bottom:1px solid var(--line)}.freight-kpis>div:last-child,.client-kpis>div:last-child,.invoice-kpis>div:last-child{border-bottom:0}.freight-filterbar{overflow:auto}.freight-filterbar>*{flex:none}.mode-selector,.quote-fields.four,.quote-fields.two,.check-grid{grid-template-columns:1fr}.quote-result{display:block}.quote-result>*{margin-bottom:12px}.variance-card{grid-column:auto}.tour-hero,.tour-pricing,.tender-value-grid,.air-reference{grid-template-columns:1fr}',
            '}',
            '@media (max-width: 420px) {',
            '  :root{--toolbar-width:78px}',
            '  .sidebar{padding:9px 5px}',
            '  .sidebar nav a{min-height:55px;font-size:7.5px}',
            '  .sidebar nav a span{max-width:60px}',
            '  .app-main{margin-left:var(--toolbar-width);width:calc(100% - var(--toolbar-width))}',
            '  .tenant-switcher b{max-width:140px}',
            '}'
          ].join('\n');
          replaceIfMissing(globals, '@media (max-width: 420px)', oldMedia, newMedia);

          const layout = 'apps/web/app/layout.tsx';
          const layoutText = read(layout);
          if (!layoutText.includes('export const viewport')) {
            write(layout, layoutText.replace('import type { Metadata } from "next";', 'import type { Metadata, Viewport } from "next";').replace('\nexport default function RootLayout', '\nexport const viewport: Viewport = {\n  width: "device-width",\n  initialScale: 1,\n  maximumScale: 5,\n  userScalable: true\n};\n\nexport default function RootLayout'));
          }
          NODE

      - name: Commit revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/control-tower.tsx apps/web/app/globals.css apps/web/app/layout.tsx
          git rm --ignore-unmatch .github/workflows/mobile-toolbar-revision.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve mobile toolbar usability"
          git push
